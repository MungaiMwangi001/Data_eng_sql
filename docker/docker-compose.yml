version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: de_postgres
    restart: always
    environment:
      POSTGRES_USER: de_user
      POSTGRES_PASSWORD: de_pass
      POSTGRES_DB: de_sql
    ports:
      - "5440:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
